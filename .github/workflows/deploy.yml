name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.x

    # Explicit rather than relying on the runner image's preinstalled Node
    # (same as Cabinet's deploy.yml). Needed for tools/*.js; no npm packages,
    # so no install step.
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Guard against docs/index.md
      run: |
        if [ -f docs/index.md ]; then
          echo "ERROR: docs/index.md must not exist. This site uses docs/index.html as the standalone Level 1 landing page. See documentation/landing-page-notes/LANDING-PAGE-NOTES.md."
          exit 1
        fi

    # Regenerates tools/build-fffx-content.js's committed output and fails
    # if it isn't what's already committed -- the generator is dev-time only
    # (run locally, output committed), so nothing else checks it was re-run
    # after the last content/*.tsv edit. Ported from Cabinet's deploy.yml.
    - name: Verify generated content is current
      run: |
        node tools/build-fffx-content.js
        if ! git diff --exit-code -- docs/_assets/backend/js/fffx-generated-content.js; then
          echo "ERROR: committed generated content is stale -- run tools/build-fffx-content.js locally and commit the result." >&2
          exit 1
        fi

    # --strict fails on broken nav/doc references. Tee'd to a log file so
    # tools/validate-deployment.js can read back MkDocs' own "unrecognized
    # relative link" INFO lines; pipefail keeps a failing build failing
    # this step despite the pipe.
    - name: Build MkDocs Site
      run: |
        set -o pipefail
        mkdocs build --site-dir public --strict 2>&1 | tee mkdocs-build.log

    - name: Copy static interactive projects
      run: |
        # Bookshelf's loop: each projects/<name>/ is served at /<name>/.
        # Each project's own docs live in its documentation/ subfolder and
        # stay in the repo only: that folder, and any stray .md file, is
        # not published.
        #
        # Each project must have its own index.html entry point (the route
        # 404s otherwise), and must not land on a path MkDocs already
        # produced -- cp -r would silently merge the two.
        for proj in projects/*/; do
          name=$(basename "$proj")
          if [ ! -f "$proj/index.html" ]; then
            echo "ERROR: $proj has no index.html -- /$name/ would 404." >&2
            exit 1
          fi
          if [ -e "public/$name" ]; then
            echo "ERROR: public/$name already exists from the MkDocs build -- projects/$name would collide with it." >&2
            exit 1
          fi
          cp -r "$proj" "public/$name"
          rm -rf "public/$name/documentation"
          find "public/$name" -name '*.md' -delete
        done

    # Cross-checks every active content/fffx-entries.tsv href, every
    # self-domain mkdocs.yml nav target, and every docs/**/*.md body link
    # against the assembled public/ tree. See the script's header.
    - name: Validate deployment routes
      run: node tools/validate-deployment.js --public-dir public --build-log mkdocs-build.log

    - name: Setup Pages
      uses: actions/configure-pages@v5

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
